name: Test
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/*.test.js
      - name: manifest.json is valid JSON and lists files that exist
        run: |
          node -e '
            const fs = require("fs"); const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const files = [m.background.service_worker, ...Object.values(m.icons), ...Object.values(m.action.default_icon)];
            const missing = files.filter((f) => !fs.existsSync(f));
            if (missing.length) { console.error("missing:", missing); process.exit(1); }
            console.log("manifest ok:", m.manifest_version, m.version, files.length, "files");'
