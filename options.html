<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Custom Playback Speed options</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0 auto;
            max-width: 36rem;
            padding: 24px 20px 48px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.45;
            color: CanvasText;
            background: Canvas;
        }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { margin: 0 0 12px; }
        label { display: block; font-weight: 600; margin-top: 16px; }
        .hint { display: block; margin-top: 2px; font-weight: 400; color: GrayText; }
        select, input {
            display: block;
            margin-top: 6px;
            width: 12rem;
            max-width: 100%;
            padding: 6px 8px;
            font: inherit;
        }
        button { margin-top: 20px; padding: 8px 16px; font: inherit; }
        #status { min-height: 1.4em; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>Custom Playback Speed</h1>
    <p>These settings apply to the speed-up and slow-down shortcuts. Reset still targets 1x, inside the limits below.</p>
    <form id="options" novalidate>
        <label for="speed-step">
            Speed step
            <span class="hint">How far Alt+Shift+Period and Alt+Shift+Comma move the speed. Default 0.25.</span>
        </label>
        <select id="speed-step" name="speed-step">
            <option value="0.05">0.05</option>
            <option value="0.1">0.1</option>
            <option value="0.25" selected>0.25</option>
            <option value="0.5">0.5</option>
        </select>

        <label for="min-speed">
            Minimum speed
            <span class="hint">Optional. Shortcuts will not go below this. Chrome allows 0.0625 to 16.</span>
        </label>
        <input id="min-speed" name="min-speed" type="number" min="0.0625" max="16" step="any" inputmode="decimal" autocomplete="off">

        <label for="max-speed">
            Maximum speed
            <span class="hint">Optional. Shortcuts will not go above this.</span>
        </label>
        <input id="max-speed" name="max-speed" type="number" min="0.0625" max="16" step="any" inputmode="decimal" autocomplete="off">

        <button type="submit">Save</button>
        <p id="status" role="status"></p>
    </form>
    <script src="speed.js"></script>
    <script src="options.js"></script>
</body>
</html>
